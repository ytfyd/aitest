# GitLab CI Configuration for API Testing Framework
# This file should be placed in .gitlab-ci.yml in your project root

stages:
  - test

variables:
  PYTHON_VERSION: "3.9"
  
api_smoke_test:
  stage: test
  image: python:$PYTHON_VERSION
  
  before_script:
    - apt-get update && apt-get install -y default-jre
    - pip install -r requirements.txt
    - wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
    - tar -xzf allure-2.24.1.tgz
    - export PATH=$PATH:$(pwd)/allure-2.24.1/bin
    
  script:
    - echo "Running API smoke tests for changed endpoints..."
    - python run_tests.py --commit-range "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
    
  artifacts:
    when: always
    paths:
      - allure-report/
      - test-results.xml
      - test-report.html
    reports:
      junit: test-results.xml
    
  only:
    - main
    - develop
    - merge_requests
    
  allow_failure: false
  
  after_script:
    - echo "Test execution completed. Check artifacts for detailed reports."